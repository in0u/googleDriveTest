<!DOCTYPE html>
<html>
<head>
  <title>Github Pages Picker Demo</title>
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script> 
</head>
<body>
  <h1>Google Drive Picker Demo (Github Pages)</h1>
  <p id="authStatus">認証中です...</p>
  <button onclick="launchPicker()" disabled id="pickerButton">Google Driveからファイルを選択</button>
  <div id="output"></div>

  <script>
 // ----------------- 設定 -----------------
    const CLIENT_ID = '729323338842-of1i7a6oqdmbau3pcc97reo84u9hirll.apps.googleusercontent.com';   // ★ GCPで取得したクライアントIDに置き換える
    const DEVELOPER_KEY = 'AIzaSyA6iZ5T-FNdIXeTDtk5NtQpeT5-7cmsGhA';       // ★ GCPで取得したAPIキーに置き換える
    const SCOPES = 'https://www.googleapis.com/auth/drive.file'; 
    
    let tokenClient;
    let accessToken = null;
    let pickerLoaded = false;

    // ----------------- 認証フロー (GIS) -----------------
    function initializeGis() {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPES,
            callback: (tokenResponse) => {
                // 認証ポップアップ後に実行される
                if (tokenResponse.error) {
                    document.getElementById('authStatus').innerText = '認証失敗: ' + tokenResponse.error;
                    return;
                }
                accessToken = tokenResponse.access_token;
                document.getElementById('authStatus').innerText = '認証完了！';
                document.getElementById('pickerButton').disabled = false;
            },
        });
        // 初回ロード時にトークンを取得を試みる
        tokenClient.requestAccessToken(); 
    }
    
    // ページロード時に認証クライアントとPicker APIのロードを開始
    window.onload = () => {
        initializeGis();
        // gapiがロードされたらPicker APIをロード
        gapi.load('picker', onPickerApiLoad); 
    };

    function onPickerApiLoad() {
        pickerLoaded = true;
        document.getElementById('authStatus').innerText += ' (Picker APIロード済み)';
    }

    // ----------------- Pickerの起動 -----------------
    function launchPicker() {
        if (!accessToken || !DEVELOPER_KEY || !pickerLoaded) {
            alert('認証中またはAPIキーが未設定です。しばらく待ってから再度お試しください。');
            // トークンを再要求
            tokenClient.requestAccessToken(); // 再認証を試みる
            return;
        }

        const view = new google.picker.DocsView(google.picker.ViewId.DOCUMENTS)
            .setMimeTypes('image/jpeg,image/png,application/pdf');

        const picker = new google.picker.PickerBuilder()
            .addView(view)
            .setOAuthToken(accessToken) // ★ GISで取得したトークンを使用 ★
            .setDeveloperKey(DEVELOPER_KEY)
            .setCallback(pickerCallback)
            // ★ setOriginでGitHub Pagesのドメインを正確に渡す ★
            .setOrigin(window.location.protocol + '//' + window.location.host)
            .build();
        
        picker.setVisible(true);
    }

    // ----------------- Pickerのコールバック処理 -----------------
    function pickerCallback(data) {
        if (data.action == google.picker.Action.PICKED) {
            const fileId = data.docs[0].id;

            // ★ ここでGAS WebアプリのURLにデータを送信する ★
            fetch('YOUR_GAS_WEB_APP_URL', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ fileId: fileId })
            })
            .then(response => response.text())
            .then(result => {
                document.getElementById('output').innerHTML = `<p>GASサーバーへの送信が完了しました: ${result}</p>`;
            })
            .catch(error => {
                document.getElementById('output').innerHTML = `<p>GASサーバーへの送信に失敗しました: ${error}</p>`;
            });

        }  else if (data.action == google.picker.Action.CANCEL) {
            document.getElementById('output').innerHTML = '<p>ファイル選択がキャンセルされました。</p>';
        }
    }
    
  </script>
</body>
</html>
